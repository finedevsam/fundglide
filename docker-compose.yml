services:
 
  backend:
    build: ./backend
    ports:
      - "8080:8080"
    env_file:
      - ./backend/.env
    networks:
      - fundglide-backend
      - fundglide-mysql
    depends_on:
      - mysqldb

  mysqldb:
    image: mysql:latest
    networks:
      - fundglide-mysql
    env_file:
      - ./backend/.env
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASS}
      MYSQL_DATABASE: ${DB_NAME}
    ports:
      - "3308:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

networks:
  fundglide-mysql:
  fundglide-backend:

volumes:
  mysql-data:

